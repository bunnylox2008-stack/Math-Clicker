<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strichmännchen Clicker</title>
<style>
  :root { --ink:#111; --soft:#f4f4f6; --gold:#f5b301; --blue:#2a7fff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:#fff; color:var(--ink); overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  input { user-select:text; -webkit-user-select:text; }
  svg { display:block; }
  #bg { position:fixed; inset:0; width:100%; height:100%; z-index:0; }

  /* ---------- Oben ---------- */
  #version {
    position:fixed; top:16px; right:16px; z-index:4;
    font-size:13px; color:#555; font-weight:700; letter-spacing:.5px;
    background:rgba(255,255,255,.85); padding:3px 10px; border-radius:999px;
  }
  #settings-btn {
    position:fixed; top:12px; left:16px; z-index:5;
    width:46px; height:46px; border-radius:50%;
    background:#fff; border:2px solid var(--ink); color:var(--ink);
    display:grid; place-items:center; cursor:pointer;
    transition:transform .5s cubic-bezier(.3,1.4,.5,1), background .2s, box-shadow .2s;
  }
  #settings-btn svg { width:26px; height:26px; }
  #settings-btn:hover { transform:rotate(90deg); background:var(--soft); box-shadow:0 4px 12px rgba(0,0,0,.15); }
  #settings-btn:active { transform:rotate(90deg) scale(.9); }

  #stats { position:fixed; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:12px; z-index:4; direction:ltr; }
  .stat {
    min-width:96px; text-align:center; padding:6px 14px;
    border:2px solid var(--ink); border-radius:14px; background:#fff;
    box-shadow:0 3px 0 var(--ink);
  }
  .stat b { display:block; font-size:20px; line-height:1.2; font-variant-numeric:tabular-nums; }
  .stat small { font-size:11px; color:#777; text-transform:uppercase; letter-spacing:.6px; white-space:nowrap; }
  .stat.bump b { animation:bump .3s ease; }
  @keyframes bump { 40% { transform:scale(1.35); color:var(--blue); } }

  /* ---------- Mitte ---------- */
  #stage { position:fixed; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  #figure-wrap { position:relative; display:flex; flex-direction:column; align-items:center; margin-top:-10px; direction:ltr; }
  #stickman {
    position:relative; width:min(94vw,540px); aspect-ratio:400/260;
    cursor:pointer; pointer-events:auto; -webkit-tap-highlight-color:transparent;
  }
  #fig { width:100%; height:100%; overflow:visible; }
  #pet { position:absolute; left:0; top:0; pointer-events:none; display:none; will-change:transform; filter:drop-shadow(0 3px 2px rgba(0,0,0,.22)); }
  #pet svg, .aico svg { width:100%; height:100%; overflow:visible; }
  .aico { padding:3px; }

  /* Bewegung der Tiere */
  .pa .legA, .pa .legB { transform-box:fill-box; transform-origin:50% 0; }
  .pa.moving .legA { animation:stepA .3s ease-in-out infinite alternate; }
  .pa.moving .legB { animation:stepB .3s ease-in-out infinite alternate; }
  @keyframes stepA { from { transform:rotate(-24deg); } to { transform:rotate(24deg); } }
  @keyframes stepB { from { transform:rotate(24deg); } to { transform:rotate(-24deg); } }
  .pa .wing { transform-box:fill-box; transform-origin:30% 90%; }
  .pa.fly .wing { animation:flap .2s ease-in-out infinite alternate; }
  @keyframes flap { from { transform:rotate(-40deg); } to { transform:rotate(28deg); } }
  .pa .flapY { transform-box:fill-box; transform-origin:50% 50%; }
  .pa.fly .flapY { animation:flapY .18s ease-in-out infinite alternate; }
  @keyframes flapY { from { transform:scaleY(1); } to { transform:scaleY(.3); } }
  .pa .tail, .pa .fin { transform-box:fill-box; transform-origin:90% 50%; animation:wag .5s ease-in-out infinite alternate; }
  .pa.float .fin, .pa.float .tail { animation-duration:.38s; }
  @keyframes wag { from { transform:rotate(-12deg); } to { transform:rotate(12deg); } }

  /* ---------- Unten ---------- */
  .btn {
    position:fixed; bottom:20px; z-index:4; overflow:hidden;
    display:flex; align-items:center; gap:10px;
    padding:12px 20px; font-size:16px; font-weight:700; color:var(--ink);
    background:#fff; border:2px solid var(--ink); border-radius:14px;
    box-shadow:0 4px 0 var(--ink); cursor:pointer;
    transition:transform .12s, box-shadow .12s, background .2s;
  }
  .btn::after {
    content:""; position:absolute; top:0; left:-80%; width:50%; height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);
    transform:skewX(-20deg); transition:left .6s;
  }
  .btn:hover { background:var(--soft); transform:translateY(-2px); box-shadow:0 6px 0 var(--ink); }
  .btn:hover::after { left:130%; }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .btn svg { width:24px; height:24px; flex:none; }
  .lbtn { left:20px; }
  #shop-btn { bottom:20px; }
  #animals-btn { bottom:84px; }
  #info-btn { bottom:148px; }

  #rebirth-btn { right:20px; flex-direction:column; align-items:flex-start; gap:2px; padding:10px 20px 14px; }
  #rebirth-btn .row { display:flex; align-items:center; gap:10px; }
  #rebirth-btn small { font-size:12px; font-weight:500; color:#666; }
  #rb-bar { position:absolute; left:0; bottom:0; height:5px; width:0; background:var(--gold); transition:width .3s; }
  #rebirth-btn.ready { background:#fff8e0; animation:ready 1.2s ease-in-out infinite; }
  #rebirth-btn.ready svg { animation:spin 2.4s linear infinite; }
  @keyframes ready {
    0%,100% { box-shadow:0 4px 0 var(--ink), 0 0 0 0 rgba(245,179,1,.7); }
    50% { box-shadow:0 4px 0 var(--ink), 0 0 0 12px rgba(245,179,1,0); }
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  #planet-btn {
    left:50%; transform:translateX(-50%);
    width:76px; height:76px; padding:4px; border-radius:50%; justify-content:center;
    box-shadow:0 4px 0 var(--ink), 0 0 18px rgba(42,127,255,.35);
  }
  #planet-btn:hover { transform:translateX(-50%) translateY(-2px) scale(1.05); background:#fff; }
  #planet-btn:active { transform:translateX(-50%) translateY(3px) scale(.96); }
  #planet-btn::after { display:none; }
  #planet-icon, #planet-btn svg { width:100%; height:100%; }

  /* Bewegung der Planeten-Symbole */
  .strip, .earth-strip { animation:scroll linear infinite; }
  @keyframes scroll { to { transform:translateX(-64px); } }
  #planet-btn.fast .strip, #planet-btn.fast .earth-strip { animation-duration:1.2s !important; }
  .earth-strip { animation-duration:14s; }
  .sun-rays { transform-origin:32px 32px; animation:spin 22s linear infinite; }
  .sun-core { transform-origin:32px 32px; animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(1.06); } }
  .orbit, .spin { transform-origin:32px 32px; animation:spin linear infinite; }
  .twinkle { transform-origin:32px 32px; animation:twinkle 1.8s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { transform:scale(.6) rotate(0); opacity:.5; } 50% { transform:scale(1.15) rotate(20deg); opacity:1; } }
  .dash { animation:dash 1.6s linear infinite; }
  @keyframes dash { to { stroke-dashoffset:-20; } }
  .jet { transform-origin:32px 32px; animation:jet 1.4s ease-in-out infinite; }
  @keyframes jet { 0%,100% { opacity:.55; transform:scaleY(.85); } 50% { opacity:1; transform:scaleY(1.1); } }

  /* ---------- Fenster ---------- */
  .panel {
    position:fixed; z-index:10; display:none;
    background:#fff; border:2px solid var(--ink); border-radius:16px;
    padding:18px; box-shadow:0 8px 0 rgba(0,0,0,.12), 0 12px 30px rgba(0,0,0,.2);
  }
  .panel.open { display:block; animation:panelIn .25s cubic-bezier(.2,1.2,.4,1); }
  @keyframes panelIn { from { opacity:0; transform:translateY(12px) scale(.94); } }
  .panel h2 { font-size:18px; margin-bottom:12px; padding-inline-end:28px; }
  .panel h2 small { font-size:13px; font-weight:600; color:#777; margin-inline-start:6px; }
  .panel .close {
    position:absolute; top:8px; inset-inline-end:10px; width:30px; height:30px;
    background:none; border:none; font-size:18px; cursor:pointer; border-radius:50%;
    transition:background .2s, transform .2s; color:var(--ink);
  }
  .panel .close:hover { background:var(--soft); transform:rotate(90deg); }
  #settings-panel { top:66px; left:16px; width:min(360px, calc(100vw - 32px)); max-height:calc(100vh - 84px); overflow:auto; }
  .sheet { top:72px; left:0; right:0; margin:auto; width:min(430px, calc(100vw - 24px)); max-height:calc(100vh - 72px - 222px); overflow:auto; }

  .setting { margin-bottom:16px; }
  .setting h3 { font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:#777; margin-bottom:8px; }
  .vol-row { display:flex; align-items:center; gap:10px; }
  .vol-row input { flex:1; accent-color:var(--ink); cursor:pointer; }
  .vol-row span { width:46px; text-align:end; font-variant-numeric:tabular-nums; font-weight:700; direction:ltr; }
  select {
    width:100%; padding:8px 10px; border:2px solid var(--ink); border-radius:10px;
    background:#fff; font-size:14px; font-weight:600; color:var(--ink);
  }
  .small-btn {
    padding:7px 14px; border:2px solid var(--ink); border-radius:10px;
    background:#fff; font-weight:600; cursor:pointer; transition:background .2s, transform .1s; color:var(--ink);
  }
  .small-btn:hover { background:var(--soft); }
  .small-btn:active { transform:scale(.96); }
  .hint { font-size:12px; color:#888; margin-top:8px; line-height:1.4; }
  .g-btn {
    display:flex; align-items:center; gap:10px; cursor:pointer; width:100%; justify-content:center;
    padding:9px 14px; border:2px solid var(--ink); border-radius:12px; background:#fff;
    font-size:14px; font-weight:700; color:var(--ink); transition:background .2s, transform .1s;
  }
  .g-btn:hover { background:var(--soft); }
  .g-btn:active { transform:scale(.97); }
  .g-btn svg { width:20px; height:20px; flex:none; }
  .acc-row { display:flex; align-items:center; gap:12px; }
  .acc-row div { min-width:0; }
  .acc-row b, .acc-row small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acc-row small { color:#777; }
  #auth-settings .small-btn { margin-top:10px; }
  #auth-settings input { width:100%; padding:10px 12px; border:2px solid var(--ink); border-radius:10px; font:inherit; margin-bottom:8px; background:#fff; }
  #auth-settings .row2 { display:flex; gap:8px; flex-wrap:wrap; }
  #auth-settings .row2 .small-btn { flex:1; margin-top:2px; }
  #auth-settings .idbox { display:flex; align-items:center; gap:8px; margin-top:10px; padding:8px 10px; border:2px dashed var(--ink); border-radius:10px; }
  #auth-settings .idbox code { flex:1; font-weight:700; letter-spacing:1px; overflow:hidden; text-overflow:ellipsis; }
  #auth-settings .idbox .small-btn { margin:0; }
  #auth-settings h4 { margin:14px 0 6px; font-size:14px; }
  #auth-settings .msg { margin-top:6px; font-size:13px; min-height:16px; }
  #auth-settings .msg.bad { color:#c0392b; } #auth-settings .msg.good { color:#1e8a3c; }

  /* Listen (Geschäft, Planeten, Tiere) */
  .item {
    display:flex; align-items:center; gap:12px; padding:10px;
    border:2px solid var(--ink); border-radius:12px; margin-bottom:10px;
    transition:transform .15s, box-shadow .15s;
  }
  .item:hover { transform:translateX(3px); box-shadow:-4px 4px 0 var(--ink); }
  .item:last-child { margin-bottom:0; }
  .item.here { background:#eefbe9; }
  .item .ico {
    width:42px; height:42px; flex:none; border-radius:10px; background:var(--ink); color:#fff;
    display:grid; place-items:center; font-weight:800; font-size:16px; direction:ltr;
  }
  .item .ico svg { width:22px; height:22px; }
  .item .pico { width:46px; height:46px; flex:none; }
  .item .aico { width:44px; height:44px; flex:none; font-size:30px; display:grid; place-items:center; background:#f4f4f6; border-radius:12px; }
  .item .txt { flex:1; min-width:0; }
  .item .txt b { display:block; font-size:15px; }
  .item .txt small { color:#777; font-size:12px; }
  .item .buy {
    flex:none; padding:8px 12px; border:2px solid var(--ink); border-radius:10px;
    background:var(--gold); font-weight:800; cursor:pointer; font-size:13px; color:var(--ink);
    transition:transform .1s, opacity .2s; max-width:140px;
  }
  .item .buy.go { background:#9be87a; }
  .item .buy:hover { transform:scale(1.06); }
  .item .buy:active { transform:scale(.94); }
  .item .buy.no { background:#eee; color:#999; border-color:#bbb; cursor:not-allowed; }
  .item .buy.no:hover { transform:none; }
  .item.flash { animation:itemFlash .5s; }
  @keyframes itemFlash { 0% { background:#fff3c4; } 100% { background:#fff; } }

  .irow { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 4px; border-bottom:2px dashed #e3e3e8; }
  .irow:last-child { border-bottom:none; }
  .irow .k { color:#777; font-weight:600; }
  .irow .v { font-size:17px; text-align:end; }
  .avail { margin-bottom:12px; padding:8px 12px; background:#fff8e0; border:2px solid var(--gold); border-radius:12px; font-weight:700; }

  /* ---------- Mathe-Aufgabe ---------- */
  #math { position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; padding:16px; }
  #math.open { display:flex; animation:fadeIn .2s; }
  @keyframes fadeIn { from { opacity:0; } }
  #math .card {
    background:#fff; border:2px solid var(--ink); border-radius:18px; padding:22px;
    width:min(380px,100%); text-align:center; box-shadow:0 8px 0 rgba(0,0,0,.2); animation:panelIn .25s cubic-bezier(.2,1.2,.4,1);
  }
  #math h2 { font-size:18px; }
  #m-q { font-size:34px; font-weight:800; margin:14px 0; direction:ltr; font-variant-numeric:tabular-nums; word-break:break-all; }
  #m-in { width:100%; padding:10px; font-size:24px; text-align:center; border:2px solid var(--ink); border-radius:12px; direction:ltr; }
  #m-fb { min-height:24px; margin:12px 0; font-weight:700; }
  #m-fb.ok { color:#1b8a2e; } #m-fb.bad { color:#c0392b; }
  #m-ok { padding:10px 26px; font-size:16px; background:var(--gold); font-weight:800; }

  /* ---------- Effekte ---------- */
  .float {
    position:fixed; z-index:50; pointer-events:none; font-weight:900; font-size:24px;
    color:var(--ink); text-shadow:0 2px 0 #fff, 0 -2px 0 #fff, 2px 0 0 #fff, -2px 0 0 #fff;
  }
  .particle { position:fixed; z-index:49; pointer-events:none; border-radius:50%; }
  #flash {
    position:fixed; inset:0; z-index:60; pointer-events:none; opacity:0;
    background:radial-gradient(circle,#fff 10%,rgba(245,179,1,.7) 60%,rgba(245,179,1,0) 100%);
  }
  .ring { position:fixed; z-index:59; pointer-events:none; border-radius:50%; border:6px solid var(--gold); }
  #warp {
    position:fixed; inset:0; z-index:80; pointer-events:none; opacity:0; overflow:hidden;
    background:radial-gradient(circle at 50% 70%,#1b2a6b,#02030a 75%);
  }
  .streak { position:absolute; top:0; width:2px; border-radius:2px; background:linear-gradient(#fff0,#fff); }
  #rocket { position:fixed; left:50%; bottom:0; width:56px; margin-left:-28px; z-index:81; pointer-events:none; opacity:0; }
  #toast {
    position:fixed; left:50%; bottom:124px; z-index:95; transform:translate(-50%,20px);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:12px; font-size:14px;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; max-width:90vw; text-align:center;
  }
  #toast.show { opacity:1; transform:translate(-50%,0); }

  @media (max-width:640px) {
    #stats { gap:6px; top:64px; }
    .sheet { top:128px; max-height:calc(100vh - 128px - 222px); }
    .stat { min-width:80px; padding:4px 8px; }
    .stat b { font-size:17px; }
    #figure-wrap { margin-top:30px; }
    .btn { padding:10px 14px; font-size:14px; gap:8px; }
    .lbtn { left:14px; }
    #animals-btn { bottom:78px; } #info-btn { bottom:136px; }
    #rebirth-btn { padding:8px 12px 12px; right:14px; }
    #rebirth-btn small { font-size:11px; }
    #planet-btn { width:66px; height:66px; padding:3px; }
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div id="version"></div>

<button id="settings-btn" aria-label="Settings">
  <svg viewBox="0 0 24 24" fill="currentColor">
    <g>
      <rect x="10.3" y="0.8" width="3.4" height="4.6" rx="1"/>
      <rect x="10.3" y="0.8" width="3.4" height="4.6" rx="1" transform="rotate(45 12 12)"/>
      <rect x="10.3" y="0.8" width="3.4" height="4.6" rx="1" transform="rotate(90 12 12)"/>
      <rect x="10.3" y="0.8" width="3.4" height="4.6" rx="1" transform="rotate(135 12 12)"/>
      <rect x="10.3" y="0.8" width="3.4" height="4.6" rx="1" transform="rotate(180 12 12)"/>
      <rect x="10.3" y="0.8" width="3.4" height="4.6" rx="1" transform="rotate(225 12 12)"/>
      <rect x="10.3" y="0.8" width="3.4" height="4.6" rx="1" transform="rotate(270 12 12)"/>
      <rect x="10.3" y="0.8" width="3.4" height="4.6" rx="1" transform="rotate(315 12 12)"/>
    </g>
    <circle cx="12" cy="12" r="7.6"/>
    <circle cx="12" cy="12" r="3.2" fill="#fff"/>
  </svg>
</button>

<div id="stats">
  <div class="stat" id="st-points"><b>0</b><small data-i18n="points"></small></div>
  <div class="stat" id="st-money"><b>0</b><small data-i18n="coins"></small></div>
  <div class="stat" id="st-rebirths"><b>0</b><small data-i18n="rebirths"></small></div>
</div>

<div id="stage">
  <div id="figure-wrap">
    <div id="stickman" role="button" aria-label="Stickman">
      <svg id="fig" viewBox="0 0 400 260"><g id="fig-aura"></g><g id="fig-body"></g></svg>
      <div id="pet" class="pa"></div>
    </div>
  </div>
</div>

<!-- Einstellungen -->
<div class="panel" id="settings-panel">
  <button class="close" data-close="settings-panel" aria-label="Close">✕</button>
  <h2 data-i18n="settings"></h2>

  <div class="setting">
    <h3 data-i18n="music_vol"></h3>
    <div class="vol-row">
      <input type="range" id="vol" min="1" max="100" step="1" value="50" aria-label="Music volume">
      <span id="vol-val">50%</span>
    </div>
  </div>

  <div class="setting">
    <h3 data-i18n="sfx_vol"></h3>
    <div class="vol-row">
      <input type="range" id="sfx" min="1" max="100" step="1" value="60" aria-label="Sound volume">
      <span id="sfx-val">60%</span>
    </div>
  </div>

  <div class="setting">
    <h3 data-i18n="language"></h3>
    <select id="lang" aria-label="Language">
      <option value="de">Deutsch</option>
      <option value="en">English</option>
      <option value="ar">العربية</option>
    </select>
  </div>

  <div class="setting">
    <h3 data-i18n="tod"></h3>
    <select id="tod" aria-label="Time of day">
      <option value="auto" data-i18n="tod_auto"></option>
      <option value="day" data-i18n="tod_day"></option>
      <option value="evening" data-i18n="tod_evening"></option>
      <option value="night" data-i18n="tod_night"></option>
    </select>
  </div>

  <div class="setting">
    <h3 data-i18n="account"></h3>
    <div id="auth-settings"></div>
  </div>

  <div class="setting" style="margin-bottom:0">
    <h3 data-i18n="save_h"></h3>
    <button class="small-btn" id="reset-btn" data-i18n="reset"></button>
    <div id="reset-confirm" style="display:none">
      <div class="hint" style="margin:0 0 8px;color:#c0392b;font-weight:600" data-i18n="reset_ask"></div>
      <button class="small-btn" id="reset-yes" style="background:#e8453c;color:#fff" data-i18n="reset_yes"></button>
      <button class="small-btn" id="reset-no" data-i18n="reset_no"></button>
    </div>
  </div>
</div>

<!-- Geschäft -->
<div class="panel sheet" id="shop-panel">
  <button class="close" data-close="shop-panel" aria-label="Close">✕</button>
  <h2 data-i18n="shop"></h2>
  <div id="shop-list"></div>
</div>

<!-- Tiere -->
<div class="panel sheet" id="animals-panel">
  <button class="close" data-close="animals-panel" aria-label="Close">✕</button>
  <h2 data-i18n="an_title"></h2>
  <div class="avail" id="an-avail"></div>
  <div id="animal-list"></div>
</div>

<!-- Infos -->
<div class="panel sheet" id="info-panel">
  <button class="close" data-close="info-panel" aria-label="Close">✕</button>
  <h2 data-i18n="info"></h2>
  <div id="info-list">
    <div class="irow"><span class="k" data-i18n="info_rank"></span><b class="v" id="i-rank"></b></div>
    <div class="irow"><span class="k" data-i18n="info_rebirths"></span><b class="v" id="i-rebirths"></b></div>
    <div class="irow"><span class="k" data-i18n="info_planet"></span><b class="v" id="i-planet"></b></div>

function tone(type, f0, f1, dur, vol, delay) {
  const t0 = actx.currentTime + (delay || 0);
  const o = actx.createOscillator(), g2 = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
  g2.gain.setValueAtTime(0.0001, t0);
  g2.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(.012, dur / 3));
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g2); g2.connect(sfxGain); o.start(t0); o.stop(t0 + dur + .03);
}
function noise(dur, vol, f0, f1, delay, q) {
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t0 = actx.currentTime + (delay || 0);
  const s = actx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q || 1;
  f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  const g2 = actx.createGain();
  g2.gain.setValueAtTime(0.0001, t0);
  g2.gain.exponentialRampToValueAtTime(vol, t0 + dur * .15);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g2); g2.connect(sfxGain); s.start(t0); s.stop(t0 + dur + .03);
}

let toastTimer;
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
function floatText(x, y, text, color) {
  const d = document.createElement('div');
  d.className = 'float'; d.textContent = text;
  d.style.left = x + 'px'; d.style.top = y + 'px'; if (color) d.style.color = color;
  document.body.appendChild(d);
  d.animate([
    { transform:'translate(-50%,0) scale(.7)', opacity:1 },
    { transform:'translate(-50%,-80px) scale(1.25)', opacity:0 }
  ], { duration:850, easing:'ease-out' }).onfinish = () => d.remove();
}
function burst(x, y, n, colors, dist) {
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div'); p.className = 'particle';
    const size = 5 + Math.random() * 7;
    p.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;background:${colors[i % colors.length]}`;
    document.body.appendChild(p);
    const a = Math.random() * Math.PI * 2, d = dist * (0.5 + Math.random() * 0.7);
    p.animate([
      { transform:'translate(-50%,-50%) scale(1)', opacity:1 },
      { transform:`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d}px)) scale(.2)`, opacity:0 }
    ], { duration:600 + Math.random()*400, easing:'cubic-bezier(.1,.7,.3,1)' }).onfinish = () => p.remove();
  }
}
function ring(x, y, color) {
  const r = document.createElement('div'); r.className = 'ring';
  r.style.cssText = `left:${x}px;top:${y}px;width:40px;height:40px;` + (color ? `border-color:${color}` : '');
  document.body.appendChild(r);
  r.animate([
    { transform:'translate(-50%,-50%) scale(.3)', opacity:1 },
    { transform:'translate(-50%,-50%) scale(30)', opacity:0 }
  ], { duration:900, easing:'ease-out' }).onfinish = () => r.remove();
}

// Geschäft
const shopRows = {};
function buildShop() {
  const list = $('shop-list'); list.innerHTML = '';
  for (const u of UPGRADES) {
    const row = document.createElement('div'); row.className = 'item';
    const ico = u.ico === 'bolt' ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>'
              : u.ico === 'speed' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6l6 6-6 6M13 6l6 6-6 6"/></svg>' : u.ico;
    row.innerHTML = `<div class="ico">${ico}</div><div class="txt"><b></b><small></small></div><button class="buy"></button>`;
    row.querySelector('.buy').onclick = () => buy(u, row);
    list.appendChild(row); shopRows[u.id] = row;
  }
}
function updateShop() {
  for (const u of UPGRADES) {
    const row = shopRows[u.id], btn = row.querySelector('.buy'), lvl = state.up[u.id];
    const nm = t('u_' + u.id);
    let desc = t('u_' + u.id + '_d');
    if (u.id === 'autospeed') desc = t('u_autospeed_d', { a:fmtRate(autoRateAt(lvl)), b:fmtRate(autoRateAt(Math.min(u.max, lvl + 1))) });
    row.querySelector('small').textContent = desc;
    btn.classList.remove('no');
    if (u.max && lvl >= u.max) {
      row.querySelector('b').textContent = u.max === 1 ? nm + ' ✓' : `${nm} (${t('level', { n:lvl })})`;
      btn.textContent = u.max === 1 ? t('bought') : t('maxed'); btn.classList.add('no');
      continue;
    }
    row.querySelector('b').textContent = u.max === 1 ? nm : `${nm} (${t('level', { n:lvl })})`;
    if (u.needs && !state.up[u.needs]) { btn.textContent = t('need_auto'); btn.classList.add('no'); continue; }
    const c = upCost(u);
    btn.textContent = t('price_pts', { n:fmt(c) });
    btn.classList.toggle('no', state.points < c);
  }
}

function buy(u, row) {
  if (u.max && state.up[u.id] >= u.max) { sfx('fail'); toast(t('already')); return; }
  if (u.needs && !state.up[u.needs]) { sfx('fail'); toast(t('need_auto')); return; }
  const c = upCost(u);
  if (state.points < c) { sfx('fail'); toast(t('missing_pts', { n:fmt(c - state.points) })); return; }
  addPoints(-c);
  state.up[u.id]++;
  sfx('buy');
  row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
  const r = row.getBoundingClientRect();
  burst(r.right - 50, r.top + r.height/2, 12, ['#f5b301', '#111'], 60);
  save(); updateShop(); render();
}
function animalAction(a, row) {
  if (state.animals.includes(a.id)) {              // schon gekauft: auswählen / abwählen
    state.pet = state.pet === a.id ? null : a.id;
    setPet(); save(); updateAnimals(); render(); return;
  }
  if (state.money < a.cost) { sfx('fail'); toast(t('an_missing', { n:a.cost, p:aName(a) })); return; }
  state.money -= a.cost; state.animals.push(a.id); state.pet = a.id;
  sfx('buy'); setPet(); render();
  row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
  const r = row.getBoundingClientRect();
  burst(r.right - 50, r.top + r.height/2, 14, ['#f5b301', '#ff9ed2', '#9be87a'], 70);
  toast(t('an_bought', { n:aName(a) }));
  save(); updateAnimals(); render();
}

/* ================= Mathe-Aufgaben ================= */
const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const decStr = x => { const s = String(Math.round(x * 100) / 100); return lang === 'de' ? s.replace('.', ',') : s; };
const plusT = max => { const a = ri(1, max - 2), b = ri(1, max - 1 - a); return { q:`${a} + ${b}`, a:a + b }; };
function minusT(lo, hi) {
  let r;
  if (lo < 0 && Math.random() < .3) r = ri(lo, -1); else r = ri(Math.max(0, lo), hi);
  let a, b;
  if (r >= 0) { b = ri(0, Math.max(20, Math.round(hi * .6))); a = r + b; }
  else { a = ri(0, Math.max(20, Math.round(-lo * 1.5))); b = a - r; }
  return { q:`${a} − ${b}`, a:r };
}
function mulT(n) { const x = ri(1, 10); return Math.random() < .5 ? { q:`${n} × ${x}`, a:n * x } : { q:`${x} × ${n}`, a:n * x }; }
function divT(n) { const x = ri(1, 10), a = n * x; return Math.random() < .5 ? { q:`${a} ÷ ${n}`, a:x } : { q:`${a} ÷ ${x}`, a:n }; }
function decT() {
  const op = pick(['+', '−', '×', '÷']);
  if (op === '+') { const a = ri(10, 990), b = ri(10, 990); return { q:`${decStr(a/10)} + ${decStr(b/10)}`, a:(a + b) / 10 }; }
  if (op === '−') { let a = ri(10, 990), b = ri(10, 990); if (b > a) [a, b] = [b, a]; return { q:`${decStr(a/10)} − ${decStr(b/10)}`, a:(a - b) / 10 }; }
  if (op === '×') { const a = ri(11, 199), b = ri(2, 9); return { q:`${decStr(a/10)} × ${b}`, a:a * b / 10 }; }
  const c = ri(11, 199), b = ri(2, 9); return { q:`${decStr(c * b / 10)} ÷ ${b}`, a:c / 10 };
}
function mixedT() {
  const op = pick(['+', '−', '×', '÷']);
  if (op === '+') { const a = ri(100, 9999), b = ri(100, 9999); return { q:`${a} + ${b}`, a:a + b }; }
  if (op === '−') { const a = ri(100, 9999), b = ri(100, 9999); return { q:`${a} − ${b}`, a:a - b }; }
  if (op === '×') { const a = ri(12, 99), b = ri(3, 25); return { q:`${a} × ${b}`, a:a * b }; }
  const b = ri(3, 20), c = ri(12, 99); return { q:`${b * c} ÷ ${b}`, a:c };
}
function makeTask(id) {
  switch (id) {
    case 'earth':    return plusT(100);
    case 'moon':     return plusT(1000);
    case 'mars':     return plusT(100000);
    case 'jupiter':  return minusT(0, 100);
    case 'saturn':   return minusT(0, 1000);
    case 'uranus':   return minusT(-100, 1000);
    case 'neptune':  return minusT(-100, 100000);
    case 'sun':      return mulT(10);
    case 'pluto':    return mulT(20);
    case 'haumea':   return mulT(ri(2, 99));
    case 'makemake': return divT(10);
    case 'eris':     return divT(20);
    case 'quaoar':   return decT();
    default:         return mixedT();
  }
}
let mathOpen = false, mathTask = null, mathDone = false;
function openMath() {
  if (mathOpen) return;
  mathTask = makeTask(state.planet); mathDone = false; mathOpen = true;
  $('m-q').textContent = mathTask.q + ' = ?';
  $('m-in').value = ''; $('m-in').disabled = false;
  $('m-in').inputMode = (mathTask.a < 0 || /−/.test(mathTask.q)) ? 'text' : 'decimal';
  $('m-fb').textContent = ''; $('m-fb').className = '';

  $('math').classList.add('open'); sfx('pop');

}
function mathSubmit() {
  if (!mathOpen) return;
  if (mathDone) { $('math').classList.remove('open'); mathOpen = false; return; }
  const raw = $('m-in').value.trim().replace(',', '.').replace('−', '-');
  if (raw === '') return;
  const v = parseFloat(raw);
  const ok = isFinite(v) && Math.abs(v - mathTask.a) < 0.005;
  mathDone = true; $('m-in').disabled = true;
  if (ok) {

}

/* ================= Tier-Bilder (selbst gezeichnet, im Stil des Strichmännchens) ================= */
const OUT = 'stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
const F  = (fill, ex) => `fill="${fill}" ${ex || ''} ${OUT}`;
const E  = (cx, cy, rx, ry, fill, ex) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" ${F(fill, ex)}/>`;
const Ci = (cx, cy, r, fill, ex) => `<circle cx="${cx}" cy="${cy}" r="${r}" ${F(fill, ex)}/>`;
const Po = (pts, fill, ex) => `<polygon points="${pts}" ${F(fill, ex)}/>`;
const Pa = (d, fill, ex) => `<path d="${d}" ${F(fill, ex)}/>`;
const Ey = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r || 1.9}" fill="#111"/>`;
const NS = 'stroke-width="0"';
// Linie mit schwarzem Umriss
const Tk = (d, color, w, ex) => `<path d="${d}" fill="none" stroke="#111" stroke-width="${w + 4}" stroke-linecap="round" stroke-linejoin="round" ${ex || ''}/><path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${ex || ''}/>`;
const wrap = inner => `<svg viewBox="0 0 64 64" overflow="visible">${inner}</svg>`;

/* ---------- Vierbeiner ---------- */
function quad(o, u) {
  const c = o.c, b = o.b || c, lift = o.lift || 0, hy = o.hy || 0, hr = o.hr || 9, ry = o.ry || 11;
  const ec = o.earc || '#f4a0a0', lw = o.lw || 6.5, legc = o.legc || c, hc = o.bf || c, mz = o.mz || b, ltop = 44 - lift;
  let s = `<defs><clipPath id="k${u}"><ellipse cx="30" cy="38" rx="17" ry="${ry}"/></clipPath></defs>`;
  const leg = (x, cls) => `<g class="${cls}"><rect x="${x}" y="${ltop}" width="${lw}" height="${58 - ltop}" rx="3" ${F(legc)}/>${o.hoof ? `<rect x="${x}" y="54" width="${lw}" height="4" rx="2" ${F('#3a3a3a')}/>` : ''}${o.claws ? Tk(`M${x + 3} 57 l-2 4 M${x + 4} 57 l1 4`, '#e8d8c0', 1.4) : ''}</g>`;
  s += leg(15, 'legA') + leg(36, 'legA') + leg(22, 'legB') + leg(43, 'legB');
  s += `<g transform="translate(0,${-lift})">`;
  const ty = 36, tc = o.tc || c;
  switch (o.tail) {
    case 'long':  s += `<g class="tail">${Tk(`M14 ${ty} Q4 ${ty - 2} 4 ${ty - 13}`, tc, 4)}</g>`; break;
    case 'thin':  s += `<g class="tail">${Tk(`M14 ${ty + 1} Q4 ${ty + 6} 3 ${ty - 4}`, tc, 1.8)}</g>`; break;
    case 'bushy': s += `<g class="tail">${E(8, ty - 2, 8, 4.5, tc, `transform="rotate(-25 8 ${ty - 2})"`)}${o.tip ? E(3, ty - 7, 3.2, 2.4, o.tip, `transform="rotate(-25 3 ${ty - 7})" ${NS}`) : ''}</g>`; break;
    case 'ring':  s += `<g class="tail">${E(8, ty - 2, 8, 4.5, tc, `transform="rotate(-25 8 ${ty - 2})"`)}${E(9, ty - 2, 1.6, 4.4, '#333', `transform="rotate(-25 9 ${ty - 2})" ${NS}`)}${E(4.5, ty - 5, 1.6, 3.4, '#333', `transform="rotate(-25 4.5 ${ty - 5})" ${NS}`)}</g>`; break;
    case 'curl':  s += `<g class="tail">${Tk(`M14 ${ty} q-6 -2 -4 -7 q3 -3 5 0`, tc, 2.4)}</g>`; break;
    case 'tuft':  s += `<g class="tail">${Tk(`M14 ${ty} Q8 ${ty + 5} 8 ${ty + 14}`, tc, 2.6)}${E(8, ty + 16, 3, 4.2, o.tuftc || '#333')}</g>`; break;
    case 'stub':  s += Ci(13, ty, 3.2, tc); break;
    case 'fluff': s += Ci(13, ty, 4.6, '#fff'); break;
    case 'paddle': s += `<g class="tail">${E(7, ty + 3, 8, 3.4, '#5a3a22')}</g>`; break;
    case 'tailup': s += `<g class="tail">${Tk(`M14 ${ty + 2} Q-4 ${ty - 2} 9 ${ty - 22}`, tc, 8)}</g>`; break;
    case 'kang':  s += `<g class="tail">${Tk(`M14 ${ty + 2} Q4 ${ty + 8} 2 ${ty + 16}`, tc, 6)}</g>`; break;
  }
  if (o.hump === 1) s += Ci(28, 28, 7, c);
  if (o.hump === 2) s += Ci(22, 28, 6.5, c) + Ci(37, 28, 6.5, c);
  if (o.mane2) s += Ci(36, 30, 10.5, o.mane2);
  s += E(30, 38, 17, ry, c);
  let cl = '';
  if (o.b && o.b !== c) cl += `<ellipse cx="30" cy="${38 + ry - 3}" rx="15" ry="${ry * .62}" fill="${b}"/>`;
  if (o.stripes) for (const x of [19, 25, 31, 37, 43]) cl += `<path d="M${x} 24 L${x - 3} 52" stroke="${o.stripes}" stroke-width="2.8" fill="none"/>`;
  if (o.spots) for (const [x, y, r] of (o.spotsPos || [[20, 34, 3], [28, 43, 3.2], [36, 33, 3.4], [44, 41, 2.8], [25, 29, 2.4]])) cl += `<circle cx="${x}" cy="${y}" r="${r}" fill="${o.spots}"/>`;
  if (o.backstripe) cl += `<path d="M10 33 Q30 22 50 33" stroke="${o.backstripe}" stroke-width="6" fill="none"/>`;
  s += `<g clip-path="url(#k${u})">${cl}</g><ellipse cx="30" cy="38" rx="17" ry="${ry}" fill="none" ${OUT}/>`;
  if (o.wool) { for (const [x, y] of [[16, 36], [19, 29], [26, 26], [34, 26], [41, 29], [44, 36], [40, 45], [30, 48], [20, 45]]) s += Ci(x, y, 6.5, o.wool); s += E(30, 38, 13, 9, o.wool, NS); }
  if (o.spikes) s += Po('11,42 9,31 16,32 14,22 22,27 25,17 30,26 35,17 38,27 45,22 44,31 51,32 48,42', o.spikes);
  if (o.pouch) s += E(33, 45, 7, 4.5, '#f1d9b5', 'stroke-width="2"');
  if (o.mane) s += o.snout === 'long' || o.hy ? Po('37,32 38,18 45,13 48,20 44,27', o.mane) : Ci(49, 29, 13.5, o.mane);
  // Kopf
  s += `<g transform="translate(0,${hy})">`;
  if (hy < -4) s += Tk(`M39 ${36 - hy} L50 30`, c, 8);
  const ear = o.ear, ef = o.ef || hc;
  if (ear === 'big') s += E(41, 30, 8.5, 11, c) + E(41, 30, 4.8, 7, ec, NS);

const bgc = $('bg'), g = bgc.getContext('2d');
let W = 0, H = 0, HOR = 0;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
function hex(h) { h = h.replace('#', ''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

// Tageszeit: Morgen/Tag hell, Abend orange, Nacht dunkel
let todMode = 'auto', hourNow = 12, light = 1, glow = 0;
const TOD_HOURS = { day:12, evening:20.2, night:23.5 };
function updateTime() {
  let h;
  if (todMode === 'auto') { const d = new Date(); h = d.getHours() + d.getMinutes() / 60; } else h = TOD_HOURS[todMode];
  hourNow = h;
  light = h < 13 ? smooth(5, 8, h) : 1 - smooth(18.5, 21.5, h);
  glow = clamp(Math.exp(-Math.pow((h - 6.3) / 1, 2)) + Math.exp(-Math.pow((h - 19.8) / 1.1, 2)));
}
function shade(c, k = 1) {
  if (typeof c === 'string') c = hex(c);
  const night = [c[0] * .2, c[1] * .27, c[2] * .5];
  return mixc(mixc(night, c, light), [255, 140, 70], glow * .22 * k);
}
function skyColors() {
  let top = mixc(hex('#050918'), hex('#62bdff'), light);
  let bot = mixc(hex('#1a2a5e'), hex('#e3f6ff'), light);
  top = mixc(top, hex('#6d6bc4'), glow * .55);
  bot = mixc(bot, hex('#ffa060'), glow * .85);
  return [top, bot];
}
function vgrad(y0, y1, stops) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  stops.forEach(([o, c]) => gr.addColorStop(o, c));
  return gr;
}

  const n = Math.ceil(W / step) + 3, arr = [];
  for (let i = 0; i < n; i++) arr.push({ x:(i - 1) * step + (r() - .5) * step * .3, y:HOR - HOR * (hMin + r() * (hMax - hMin)), v:HOR - HOR * (vMin + r() * (vMax - vMin)) });
  return { arr, step };
}
function buildScene() {
  const r = rng(1234);
  HOR = Math.round(H * .5);
  stars = Array.from({ length:110 }, () => ({ x:r(), y:r(), r:1 + r() * 1.6, tw:1 + r() * 3, p:r() * 6 }));
  clouds = Array.from({ length:6 }, () => ({ x:r() * W, y:HOR * (.1 + .38 * r()), s:.7 + r() * .9, v:6 + r() * 10 }));
  birds = Array.from({ length:7 }, () => ({ x:r() * W, y:HOR * (.15 + .45 * r()), v:(34 + r() * 30) * (r() < .65 ? 1 : -1), size:6 + r() * 5, ph:r() * 6, bob:r() * 6 }));
  farPeaks  = makePeaks(r, .2, .38, .05, .12, Math.max(110, W / 6));
  nearPeaks = makePeaks(r, .09, .2, .03, .07, Math.max(150, W / 4.2));
  mtnPeaks  = makePeaks(r, .1, .3, .02, .08, Math.max(150, W / 5));
  const nb = clamp(W / 3, 140, 420) | 0;
  blades = Array.from({ length:nb }, () => {
    const y = HOR + 4 + r() * (H - HOR - 4), d = (y - HOR) / (H - HOR);
    return { x:r() * (W + 20) - 10, y, d, h:8 + d * 30 + r() * 8, c:(r() * 3) | 0, ph:r() * 6 };
  }).sort((a, b) => a.y - b.y);
  const FL = ['#ff5a6e', '#ffd23f', '#ffffff', '#b07cff', '#ff9ed2'];
  flowers = Array.from({ length:clamp(W / 20, 16, 34) | 0 }, () => {
    const y = HOR + 22 + r() * (H - HOR - 50), d = (y - HOR) / (H - HOR);
    return { x:r() * W, y, d, size:4 + d * 7, h:12 + d * 34, col:FL[(r() * FL.length) | 0], ph:r() * 6 };
  }).sort((a, b) => a.y - b.y);
  craters = Array.from({ length:14 }, () => {
    const y = HOR + 16 + r() * (H - HOR - 40), d = (y - HOR) / (H - HOR);
    return { x:r() * W, y, rx:12 + d * 70 * (.5 + r()), d };
  });
  dust = Array.from({ length:46 }, () => ({ x:r() * W, y:HOR * .3 + r() * (H - HOR * .3), r:1 + r() * 2.5, v:12 + r() * 30, ph:r() * 6 }));
  plasma = Array.from({ length:26 }, () => ({ x:r() * W, y:r() * H, r:30 + r() * 70, v:12 + r() * 30, ph:r() * 6 }));
}
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  bgc.width = W * dpr; bgc.height = H * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildScene();
}
addEventListener('resize', resize);

function drawRange(range, color, snow) {
  const { arr, step } = range;
  g.fillStyle = css(shade(color));
  g.beginPath(); g.moveTo(-20, HOR);
  arr.forEach((p, i) => { g.lineTo(p.x, p.y); const nx = arr[i + 1]; if (nx) g.lineTo(p.x + step / 2, (p.v + nx.v) / 2); });
  g.lineTo(W + 40, HOR); g.closePath(); g.fill();
  if (snow) {
    g.fillStyle = css(shade('#ffffff', 1.4));
    arr.forEach(p => {
      const dep = HOR - p.y; if (dep < HOR * .24) return;
      const f = .26, vy = HOR - HOR * .08, ky = p.y + (vy - p.y) * f, kx = step * .5 * f;
      g.beginPath();
      g.moveTo(p.x, p.y); g.lineTo(p.x - kx, ky);
      g.lineTo(p.x - kx * .45, ky - 4); g.lineTo(p.x, ky + 9); g.lineTo(p.x + kx * .45, ky - 4);
      g.lineTo(p.x + kx, ky); g.closePath(); g.fill();
    });
  }
}
function sway(x, t, amp) { return (Math.sin(t * 1.7 + x * .012) + .5 * Math.sin(t * 3.1 + x * .03)) * amp * (.65 + .35 * Math.sin(t * .4)); }

function drawStars(t, strength) {
  for (const s of stars) {
    const a = strength * (.5 + .5 * Math.sin(t * s.tw + s.p));
    g.fillStyle = `rgba(255,255,240,${a * .9})`;
    g.fillRect(s.x * W, s.y * HOR * .92, s.r, s.r);
  }
}

/* --- Erde --- */
function drawEarth(t, dt) {
  const [top, bot] = skyColors();
  g.fillStyle = vgrad(0, HOR, [[0, css(top)], [1, css(bot)]]);
  g.fillRect(0, 0, W, HOR + 2);
  if (light < .85) drawStars(t, 1 - light / .85);

  // Sonne
  if (hourNow > 5.3 && hourNow < 20.8) {
    const p = (hourNow - 6) / 14, x = W * (.08 + .84 * p), y = HOR - Math.sin(clamp(p, 0, 1) * Math.PI) * HOR * .76 + 8;
    const col = mixc(hex('#fff6a8'), hex('#ff8a3a'), glow);
    const gr = g.createRadialGradient(x, y, 4, x, y, 120);
    gr.addColorStop(0, css(col, .75)); gr.addColorStop(1, css(col, 0));
    g.fillStyle = gr; g.fillRect(x - 130, y - 130, 260, 260);
    g.fillStyle = css(mixc(col, [255, 255, 255], .35)); g.beginPath(); g.arc(x, y, 28, 0, 7); g.fill();
  }
  // Mond
  const m = (hourNow >= 12 ? hourNow - 20 : hourNow + 4) / 10;
  if (m > -.05 && m < 1.05 && light < .9) {
    const a = 1 - light / .9, x = W * (.1 + .8 * clamp(m, 0, 1)), y = HOR - Math.sin(clamp(m, 0, 1) * Math.PI) * HOR * .7 + 14;
    const gr = g.createRadialGradient(x, y, 6, x, y, 80);
    gr.addColorStop(0, `rgba(210,225,255,${.5 * a})`); gr.addColorStop(1, 'rgba(210,225,255,0)');
    g.fillStyle = gr; g.fillRect(x - 90, y - 90, 180, 180);
    g.fillStyle = `rgba(245,243,222,${a})`; g.beginPath(); g.arc(x, y, 22, 0, 7); g.fill();
    g.fillStyle = `rgba(200,198,180,${.55 * a})`;
    g.beginPath(); g.arc(x - 6, y - 4, 5, 0, 7); g.arc(x + 7, y + 6, 4, 0, 7); g.arc(x + 4, y - 9, 2.5, 0, 7); g.fill();
  }

  drawRange(farPeaks, '#8fb5e8', true);
  g.fillStyle = vgrad(HOR * .55, HOR, [[0, css([255, 255, 255], 0)], [1, css(shade('#ffffff'), .5)]]);
  g.fillRect(0, HOR * .55, W, HOR * .45);

  // Wolken
  g.fillStyle = css(shade('#ffffff', .9), .94);
  for (const c of clouds) {
    c.x += c.v * dt; if (c.x > W + 160) c.x = -160;
    const R = 26 * c.s;
    g.beginPath();
    g.arc(c.x, c.y, R, 0, 7); g.arc(c.x + R * .95, c.y - R * .3, R * .85, 0, 7); g.arc(c.x - R * .95, c.y - R * .1, R * .7, 0, 7);
    g.arc(c.x + R * 1.8, c.y, R * .6, 0, 7); g.arc(c.x - R * 1.7, c.y + R * .1, R * .55, 0, 7);
    g.rect(c.x - R * 1.7, c.y, R * 3.5, R * .62); g.fill();
  }

  drawRange(nearPeaks, '#6e9fd8', false);

  // Hügel + Wiese
  g.fillStyle = css(shade('#93e070'));
  g.beginPath(); g.moveTo(0, HOR + 2);
  for (let x = 0; x <= W + 8; x += 8) g.lineTo(x, HOR - 4 - (Math.sin(x * .004 + 1.3) * .5 + .5) * 18 - (Math.sin(x * .011) * .5 + .5) * 7);
  g.lineTo(W, HOR + 2); g.closePath(); g.fill();
  g.fillStyle = vgrad(HOR, H, [[0, css(shade('#a8ee86'))], [1, css(shade('#6fcd55'))]]);
  g.fillRect(0, HOR, W, H - HOR);

  // Vögel
  const ba = clamp(light * 1.6);
  if (ba > .02) {
    g.strokeStyle = css(shade('#2d2d38'), ba); g.lineCap = 'round';
    for (const b of birds) {
      b.x += b.v * dt; if (b.v > 0 && b.x > W + 40) b.x = -40; if (b.v < 0 && b.x < -40) b.x = W + 40;
      const y = b.y + Math.sin(t * .8 + b.bob) * 10, wy = Math.sin(t * 8 + b.ph) * b.size * .7, s = b.size;
      g.lineWidth = 2;
      g.beginPath();
      g.moveTo(b.x - s, y - wy); g.quadraticCurveTo(b.x - s * .5, y - wy * .2 - s * .4, b.x, y);
      g.quadraticCurveTo(b.x + s * .5, y - wy * .2 - s * .4, b.x + s, y - wy); g.stroke();
    }

  // Gras im Wind
  const cols = [css(shade('#5fc545')), css(shade('#7fdc62')), css(shade('#4aae39'))];

  for (const f of flowers) {
    const sx = sway(f.x + f.ph * 40, t, f.h * .3), hx = f.x + sx, hy = f.y - f.h;

    g.beginPath(); g.arc(hx, hy, f.size * .38, 0, 7); g.fill();
  }
}

/* --- Mars --- */
function drawMars(t, dt) {
  g.fillStyle = vgrad(0, HOR, [[0, '#c68a66'], [1, '#f5cfa6']]); g.fillRect(0, 0, W, HOR + 2);
  const sx = W * .2, sy = HOR * .3, gr = g.createRadialGradient(sx, sy, 3, sx, sy, 90);
  gr.addColorStop(0, 'rgba(255,245,225,.85)'); gr.addColorStop(1, 'rgba(255,245,225,0)');
  g.fillStyle = gr; g.fillRect(sx - 100, sy - 100, 200, 200);
  g.fillStyle = '#fff4e0'; g.beginPath(); g.arc(sx, sy, 12, 0, 7); g.fill();
  g.fillStyle = 'rgba(120,60,40,.6)'; g.beginPath(); g.arc(W * .66 + Math.sin(t * .05) * 40, HOR * .22, 5, 0, 7); g.fill();
  g.fillStyle = '#a85a3c';
  g.beginPath(); g.moveTo(-20, HOR);
  mtnPeaks.arr.forEach((p, i) => { g.lineTo(p.x, p.y + HOR * .08); const nx = mtnPeaks.arr[i + 1]; if (nx) g.lineTo(p.x + mtnPeaks.step / 2, HOR - 2); });
  g.lineTo(W + 40, HOR); g.fill();
  g.fillStyle = '#c9663d'; g.fillRect(0, HOR - 1, W, H - HOR + 1);
  const dunes = [['#c9663d', HOR, 12, .006, 1], ['#b4552f', HOR + (H - HOR) * .3, 22, .005, 2.2], ['#9a4527', HOR + (H - HOR) * .62, 30, .004, 4]];
  for (const [col, y0, amp, fq, ph] of dunes) {
    g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W + 8; x += 8) g.lineTo(x, y0 + Math.sin(x * fq + ph) * amp + Math.sin(x * fq * 2.3 + ph * 2) * amp * .35);
    g.lineTo(W, H); g.fill();
  }
  g.fillStyle = 'rgba(255,215,170,.25)';
  for (const p of dust) {
    p.x += p.v * dt; if (p.x > W + 10) p.x = -10;
    g.beginPath(); g.arc(p.x, p.y + Math.sin(t + p.ph) * 6, p.r, 0, 7); g.fill();
  }
}

function drawDisc(d, t) {
  const R = Math.min(W, H) * d.r, x = W * d.x, y = HOR * d.y;
  if (d.kind === 'earth') {
    const gl = g.createRadialGradient(x, y, R * .8, x, y, R * 2.2);
    gl.addColorStop(0, 'rgba(120,190,255,.4)'); gl.addColorStop(1, 'rgba(120,190,255,0)');
    g.fillStyle = gl; g.fillRect(x - R * 2.4, y - R * 2.4, R * 4.8, R * 4.8);
    const og = g.createRadialGradient(x - R * .3, y - R * .3, R * .1, x, y, R);
    og.addColorStop(0, '#8fd3ff'); og.addColorStop(1, '#1c5fd1');
    g.fillStyle = og; g.beginPath(); g.arc(x, y, R, 0, 7); g.fill();
    g.save(); g.beginPath(); g.arc(x, y, R, 0, 7); g.clip(); g.fillStyle = '#4caf50';
    g.beginPath(); g.ellipse(x - R * .3, y - R * .2, R * .35, R * .22, .4, 0, 7); g.ellipse(x + R * .35, y + R * .25, R * .3, R * .2, -.3, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,.85)'; g.fillRect(x - R, y - R, R * 2, R * .14); g.restore();
  } else if (d.kind === 'sun') {
    const gl = g.createRadialGradient(x, y, 1, x, y, 40);
    gl.addColorStop(0, 'rgba(255,240,220,.9)'); gl.addColorStop(1, 'rgba(255,240,220,0)');
    g.fillStyle = gl; g.fillRect(x - 40, y - 40, 80, 80);
    g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill();
  } else {
    const gl = g.createRadialGradient(x, y, R * .8, x, y, R * 2);
    gl.addColorStop(0, 'rgba(255,255,255,.18)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gl; g.fillRect(x - R * 2.2, y - R * 2.2, R * 4.4, R * 4.4);
    const og = g.createRadialGradient(x - R * .3, y - R * .3, R * .1, x, y, R);
    og.addColorStop(0, d.color[0]); og.addColorStop(1, d.color[1]);
    g.fillStyle = og; g.beginPath(); g.arc(x, y, R, 0, 7); g.fill();
    g.fillStyle = 'rgba(0,0,0,.18)';
    g.beginPath(); g.arc(x - R * .3, y - R * .1, R * .22, 0, 7); g.arc(x + R * .35, y + R * .3, R * .16, 0, 7); g.arc(x + R * .1, y - R * .5, R * .12, 0, 7); g.fill();
  }
}

function drawRocky(t, c) {

const GAS = {

function drawGas(t, c) {
  const cols = c.cols, n = 13, bh = H / n + 4;
  g.fillStyle = cols[0]; g.fillRect(0, 0, W, H);
  for (let i = 0; i < n; i++) {

    g.fillStyle = cols[i % cols.length]; g.beginPath(); g.moveTo(0, y0 + bh + 8);
    for (let x = 0; x <= W + 10; x += 10) g.lineTo(x, y0 + Math.sin(x * .008 + ph) * 7 + Math.sin(x * .021 + ph * 1.7) * 3);
    g.lineTo(W, y0 + bh + 8); g.closePath(); g.fill();
  }
  if (c.ring) {
    g.save(); g.lineCap = 'round';
    g.strokeStyle = 'rgba(245,230,190,.55)'; g.lineWidth = 22; g.beginPath(); g.ellipse(W * .5, H * .22, W * .95, H * .16, -.1, Math.PI * 1.05, Math.PI * 1.95); g.stroke();
    g.strokeStyle = 'rgba(210,180,120,.5)'; g.lineWidth = 8; g.beginPath(); g.ellipse(W * .5, H * .22, W * .78, H * .125, -.1, Math.PI * 1.07, Math.PI * 1.93); g.stroke();
    g.restore();

  if (c.spot) {
    const cx = W * c.spot.x + Math.sin(t * .06) * 30, cy = H * c.spot.y;
    g.fillStyle = 'rgba(240,201,160,.6)'; g.beginPath(); g.ellipse(cx, cy, 92, 50, 0, 0, 7); g.fill();
    g.fillStyle = c.spot.col; g.beginPath(); g.ellipse(cx, cy, 78, 40, 0, 0, 7); g.fill();
    g.strokeStyle = 'rgba(255,200,160,.6)'; g.lineWidth = 3;
    for (let k = 0; k < 3; k++) { g.beginPath(); g.ellipse(cx, cy, 55 - k * 16, 28 - k * 8, 0, t * (1 + k * .3), t * (1 + k * .3) + 4); g.stroke(); }

const petEl = $('pet');
const P = { a:null, x:0, y:0, tx:0, ty:0, dir:1, wait:0, ps:60, bw:400, bh:260, ph:0, key:null };
function petBox() {
  const el = $('stickman');          // offsetWidth ignoriert die Klick-Animation (scale) -> kein Springen
  P.bw = el.offsetWidth; P.bh = el.offsetHeight;
}
function setPet() {
  const a = state.pet ? animalById(state.pet) : null;
  P.a = a;
  if (!a || !PET[a.n[0]]) { petEl.style.display = 'none'; petEl.innerHTML = ''; P.key = null; return; }
  const d = PET[a.n[0]];
  petBox();
  P.ps = Math.max(46, Math.min(84, P.bw * .17)) * d.sz;
  petEl.style.width = petEl.style.height = P.ps + 'px';
  petEl.innerHTML = d.draw('pet');
  petEl.className = 'pa ' + (d.m === 'fly' ? 'fly' : d.m === 'float' ? 'float' : '');
  petEl.style.display = 'block';
  if (P.key !== a.id) {                // nur bei einem neuen Tier neu starten
    P.key = a.id; P.wait = 0;
    P.x = P.bw * (Math.random() < .5 ? -.02 : .86); P.y = groundY(d);
    pickTarget();
  }
}
function groundY(d) { return P.bh * .895 - P.ps * .92 + (d.m === 'hop' ? 0 : 0); }
function pickTarget() {
  const d = PET[P.a.n[0]], bw = P.bw, bh = P.bh;
  const rx = () => -bw * .04 + Math.random() * bw * 1.0;
  if (d.m === 'fly')   { P.tx = rx(); P.ty = bh * (.0 + Math.random() * .5) - P.ps * .5; }
  else if (d.m === 'float') { P.tx = rx(); P.ty = bh * (.05 + Math.random() * .6) - P.ps * .3; }
  else { P.tx = rx(); P.ty = groundY(d) + (Math.random() - .5) * bh * .06; }
}
function updatePet(tm, dt) {
  if (!P.a || P.key !== state.pet) return;
  const d = PET[P.a.n[0]];
  if (frameN % 30 === 0) {
    const ow = P.bw, oh = P.bh; petBox();
    if (Math.abs(ow - P.bw) > 2) {
      const k = P.bw / ow, d2 = PET[P.a.n[0]];
      P.x *= k; P.tx *= k; P.y *= P.bh / oh; P.ty *= P.bh / oh;
      P.ps = Math.max(46, Math.min(84, P.bw * .17)) * d2.sz;
      petEl.style.width = petEl.style.height = P.ps + 'px';
    }
  }
  const dx = P.tx - P.x, dy = P.ty - P.y, dist = Math.hypot(dx, dy);
  const speed = P.bw * (d.m === 'fly' ? .30 : d.m === 'float' ? .09 : d.m === 'hop' ? .17 : .12) * (d.sz > 1.2 ? .8 : 1);
  let moving = false;
  if (P.wait > 0) P.wait -= dt;
  else if (dist < 4) { P.wait = d.m === 'fly' ? .2 + Math.random() * 1 : .6 + Math.random() * 2.2; pickTarget(); }
  else {
    moving = true;
    const st = Math.min(dist, speed * dt);
    P.x += dx / dist * st; P.y += dy / dist * st;
    if (Math.abs(dx) > 3) P.dir = dx > 0 ? 1 : -1;
    P.ph += dt * (d.m === 'hop' ? 9 : d.m === 'fly' ? 6 : 3);
  }
  let ox = 0, oy = 0;
  if (d.m === 'hop') oy = moving ? -Math.abs(Math.sin(P.ph)) * P.ps * .28 : 0;
  else if (d.m === 'fly') oy = Math.sin(tm * 5) * 3;
  else if (d.m === 'float') { oy = Math.sin(tm * 1.6) * 5; ox = Math.cos(tm * 1.1) * 3; }
  else if (moving) oy = -Math.abs(Math.sin(P.ph)) * 2;
  petEl.classList.toggle('moving', moving && (d.m === 'walk' || d.m === 'hop'));
  petEl.style.transform = `translate(${(P.x + ox).toFixed(1)}px,${(P.y + oy).toFixed(1)}px) scaleX(${P.dir})`;
}

let lastT = 0, frameN = 0;
function frame(ms) {
  const tm = ms / 1000, dt = Math.min(.05, Math.max(0, tm - lastT)); lastT = tm;
  if (frameN++ % 30 === 0) updateTime();
  g.clearRect(0, 0, W, H);
  (SCENES[state.planet] || drawEarth)(tm, dt);
  drawFigure(tm, dt);
  updatePet(tm, dt);
  requestAnimationFrame(frame);
}

function newId() {
  const al = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = '';
  const r = crypto.getRandomValues(new Uint8Array(8));
  for (const b of r) s += al[b % al.length];
  return 'SM-' + s.slice(0, 4) + '-' + s.slice(4);
}
function afterAccountChange() { updatePlanetIcon(); setPet(); renderAll(); renderAuth(); }
async function doAuth(mode) {
  const name = $('au-u').value.trim(), pw = $('au-p').value, msg = box => box;
  const out = $('au-msg'); out.className = 'msg bad';
  const key = name.toLowerCase(), acc = accounts();
  if (mode === 'reg') {
    if (name.length < 3 || pw.length < 4) { out.textContent = t('e_short'); return; }
    if (acc[key]) { out.textContent = t('e_taken'); return; }
    const salt = b64u(crypto.getRandomValues(new Uint8Array(12)));
    const a = { name, id:newId(), salt, hash:await hashPw(pw, salt) };
    acc[key] = a; localStorage.setItem(ACC_KEY, JSON.stringify(acc));
    const current = state;
    user = { name:a.name, id:a.id };
    localStorage.setItem('sm_user', JSON.stringify(user));
    state = current; save();                       // neues Konto übernimmt den aktuellen Fortschritt
    afterAccountChange(); toast(t('registered', { id:a.id }));
  } else {
    const a = acc[key];
    if (!a || a.hash !== await hashPw(pw, a.salt)) { out.textContent = t('e_wrong'); return; }
    save();
    user = { name:a.name, id:a.id };
    localStorage.setItem('sm_user', JSON.stringify(user));
    load(); afterAccountChange(); toast(t('logged_in', { n:a.name }));
  }
}
function logout() {
  save(); user = null;
  try { localStorage.removeItem('sm_user'); } catch(e) {}
  load(); afterAccountChange(); toast(t('logged_out'));
}
/*CODES_START*/const CODES = {};/*CODES_END*/   // Wort-Codes (als Hash gespeichert), werden von admin.html eingetragen
const sha256hex = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, '0')).join('');
async function redeem() {
  const out = $('au-msg'); out.className = 'msg bad';
  if (!user) { out.textContent = t('c_login'); return; }
  const code = $('au-code').value.trim();
  try {
    let id, type, amt, nonce, uses = 1;
    const word = code.toUpperCase().replace(/[^A-Z0-9_-]/g, '');
    const h = word ? await sha256hex('sm|' + word) : '';
    if (h && CODES[h]) {                                        // kurzes Wort als Code
      const e = CODES[h]; id = e.i || '*'; type = e.t; amt = e.a; uses = e.u; nonce = 'W' + h.slice(0, 12);
    } else {                                                    // langer, signierter Code
      const raw = code.includes('~') ? code.slice(code.indexOf('~') + 1) : code;
      const [pl, sg] = raw.split('.');
      const key = await crypto.subtle.importKey('jwk', PUBKEY, { name:'ECDSA', namedCurve:'P-256' }, false, ['verify']);
      const ok = await crypto.subtle.verify({ name:'ECDSA', hash:'SHA-256' }, key, unb64u(sg), unb64u(pl));
      if (!ok) throw 0;
      const parts = new TextDecoder().decode(unb64u(pl)).split('|');
      if (parts.length === 3) [id, amt, nonce] = parts, type = 'coins';
      else if (parts.length === 4) [id, type, amt, nonce] = parts;
      else [id, type, amt, nonce, uses] = parts;
    }
    const n = parseInt(amt, 10); uses = parseInt(uses, 10) || 1;
    if (!(n > 0) || !['coins', 'points', 'rebirths'].includes(type)) throw 0;
    if (id !== '*' && id !== user.id) { out.textContent = t('c_id'); return; }
    const rk = 'sm_redeemed_' + user.id; let used = {};
    try { used = JSON.parse(localStorage.getItem(rk)) || {}; } catch(e) {}
    if (Array.isArray(used)) used = Object.fromEntries(used.map(x => [x, 1]));     // alter Speicherstand
    if ((used[nonce] || 0) >= uses) { out.textContent = t('c_used'); return; }
    used[nonce] = (used[nonce] || 0) + 1; localStorage.setItem(rk, JSON.stringify(used));
    let before = state.owned.length;
    if (type === 'coins') state.money += n;
    else if (type === 'points') addPoints(n);
    else { state.rebirths += n; syncOwned(); }
    save(); renderAll(); updateAnimals(); updatePlanets();
    if (type === 'rebirths' && state.owned.length > before) toast(t('unlocked', { n:pName(planetById(state.owned[state.owned.length - 1])) }));
    sfx(type === 'rebirths' ? 'rebirth' : 'correct'); out.className = 'msg good'; out.textContent = t('c_ok_' + type, { n:fmt(n) });
    $('au-code').value = '';
  } catch(e) { out.textContent = t('c_bad'); }
}
function renderAuth() {
  const box = $('auth-settings');
  if (user) {
    box.innerHTML = `<div class="acc-row"><div><b></b><small></small></div></div>
      <div class="idbox"><code></code><button class="small-btn" id="copy-id"></button></div>
      <h4></h4><input id="au-code" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="row2"><button class="small-btn" id="redeem-btn"></button><button class="small-btn" id="logout-btn"></button></div><div class="msg" id="au-msg"></div>`;
    box.querySelector('b').textContent = user.name;
    box.querySelector('small').textContent = t('acc_id');
    box.querySelector('code').textContent = user.id;
    $('copy-id').textContent = t('copy');
    $('copy-id').onclick = () => { try { navigator.clipboard.writeText(user.id); } catch(e) {} toast(t('copied')); };
    box.querySelector('h4').textContent = t('code_title');
    $('au-code').placeholder = t('code_ph');
    $('redeem-btn').textContent = t('redeem'); $('redeem-btn').onclick = redeem;
    $('logout-btn').textContent = t('logout'); $('logout-btn').onclick = logout;
    return;
  }
  box.innerHTML = `<div class="hint"></div><input id="au-u" autocomplete="username" autocapitalize="off"><input id="au-p" type="password" autocomplete="current-password">
    <div class="row2"><button class="small-btn" id="au-login"></button><button class="small-btn" id="au-reg"></button></div><div class="msg" id="au-msg"></div>`;
  box.querySelector('.hint').textContent = t('login_hint');
  $('au-u').placeholder = t('u_ph'); $('au-p').placeholder = t('p_ph');
  $('au-login').textContent = t('login'); $('au-reg').textContent = t('register');
  $('au-login').onclick = () => doAuth('login'); $('au-reg').onclick = () => doAuth('reg');
}

load();
applyStatic();
buildShop();
buildPlanets();
buildAnimals();
updatePlanetIcon();
setPet();
renderAuth();
renderAll();
updateTime();
resize();
requestAnimationFrame(frame);

// Auto-Klicker: klickt automatisch (zählt wie ein echter Klick, mit allen Upgrades)
let autoAcc = 0;
setInterval(() => {
  const rate = autoRate();
  if (rate <= 0 || mathOpen) return;
  autoAcc += rate * .1;
  let n = 0;
  while (autoAcc >= 1) { autoAcc -= 1; n++; }
  if (!n) return;
  const v = clickValue() * n;
  addPoints(v);
  const now = performance.now();
  if (now - lastAutoFloat > 260) {
    lastAutoFloat = now;
    const b = $('stickman').getBoundingClientRect();
    floatText(b.left + b.width * (.45 + Math.random() * .3), b.top + b.height * .35, '+' + (v < 100 ? v.toLocaleString(LOC(), { maximumFractionDigits:2 }) : fmt(v)), '#555');
  }
  render();
}, 100);
// Spielzeit
setInterval(() => { if (!document.hidden) { state.playTime++; if (isOpen('info-panel')) updateInfo(); } }, 1000);
setInterval(save, 2000);
window.addEventListener('beforeunload', save);
</script>
